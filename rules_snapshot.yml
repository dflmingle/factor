  - tooltip "❓ 什么是 IC 记录 因子每经历一个完整持有期，系统即计算一次周期 RankIC（1 条记录 = 1 个样本），用以衡量“因子选股排序”与“标的实际涨跌幅排序”的吻合度。 月末统计逻辑 系统将当月所有记录汇总为三项核心指标，用于评估因子表现： ·均值（|RankIC|）：反映因子的预测方向准确性。 ·稳定性（|ICIR|）：均值除以标准差，反映因子表现的波动程度。 ·胜率：结合因子方向（升序/降序），预测正确的样本占比。 ⚠️ 关键说明 ·条数 ≠ 分数：记录数量仅代表统计可信度，不直接决定得分高低。 ·统一节奏：调仓周期由因子池全局配置，全池因子记录节奏一致；换手率为组合级实测数据，不按单因子拆分。":
    - paragraph:
      - generic: ❓ 什么是 IC 记录
      - text: 因子每经历一个完整持有期，系统即计算一次周期 RankIC（1 条记录 = 1 个样本），用以衡量“因子选股排序”与“标的实际涨跌幅排序”的吻合度。
    - paragraph: 月末统计逻辑系统将当月所有记录汇总为三项核心指标，用于评估因子表现：
    - list:
      - listitem: ·均值（|RankIC|）：反映因子的预测方向准确性。
      - listitem: ·稳定性（|ICIR|）：均值除以标准差，反映因子表现的波动程度。
      - listitem: ·胜率：结合因子方向（升序/降序），预测正确的样本占比。
    - paragraph:
      - generic: ⚠️ 关键说明
    - list:
      - listitem: ·条数 ≠ 分数：记录数量仅代表统计可信度，不直接决定得分高低。
      - listitem: ·统一节奏：调仓周期由因子池全局配置，全池因子记录节奏一致；换手率为组合级实测数据，不按单因子拆分。
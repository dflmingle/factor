              - generic [ref=f3e370]:
                - text: 演示口径与计算规则
                - list [ref=f3e371]:
                  - listitem [ref=f3e372]: 统一调仓：因子池采用统一调仓周期（1—10 个交易日），提交后锁定。池内因子及合成组合按统一周期同步调仓和采样；如工作流参数与因子池配置冲突，以因子池配置为准。
                  - listitem [ref=f3e373]: 生效与采样：新增因子下一个调仓日纳入合成。由于需要经过一个完整持有期，首条 IC 记录于纳入后的第二个调仓日生成。
                  - listitem [ref=f3e374]: 绩效核算：Rex 和 SR 使用当月全部日频数据计算并年化；MaxDD 根据当月日频净值曲线计算。IC 按统一调仓周期采样，月度指标由当月有效样本汇总计算。积分于月末统一结算。
                  - listitem [ref=f3e375]: 换手率口径：Turnover 为当月各统一调仓日组合换手率之和。演示数据仅用于展示，正式评分以后台实盘组合数据为准。
                  - listitem [ref=f3e376]: 榜单预估：“预估分”根据当月截至当前交易日的数据动态计算，仅供参考；最终成绩以月末结算结果为准。
                  - listitem [ref=f3e377]: 演示假设：演示行情覆盖 9 月至 10 月中旬；每月 1—3 日为因子修改和删除窗口，相关操作于下一个统一调仓日生效。

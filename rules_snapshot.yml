            - article [ref=f3e583]:
              - generic [ref=f3e584]:
                - heading "Q1：IC / IC_IR 的计算口径为什么有差异？" [level=4] [ref=f3e585]
                - paragraph [ref=f3e586]: 样本内（近 5 个完整自然年）计入「因子历史绩效」（占 20%）；样本外是「样本外外推绩效」与「多头组合绩效」的核算来源（占 80%），为积分大头。IC、IR 按因子池统一调仓周期采样计算（一个调仓周期一个截面点），与组合调仓完全对齐；周期越短样本越密，ICIR 的标准差估计越稳。
              - generic [ref=f3e587]:
                - heading "Q2：因子池的调仓周期怎么定？" [level=4] [ref=f3e588]
                - paragraph [ref=f3e589]: 创建因子池时统一配置，可选 1–10 个交易日：池内全部因子与合成组合按该周期同步调仓、同步采样 IC。所选工作流内置的调仓参数与之不一致时，默认以因子池配置为准（工作流参数不生效）。该周期与绩效核算数据口径绑定，提交因子池后不可修改。
              - generic [ref=f3e590]:
                - heading "Q3：机器学习方式怎么参赛？" [level=4] [ref=f3e591]
                - paragraph [ref=f3e592]: 通过工作流（AI 工作流）搭建机器学习模型并生成因子，提交时选择对应工作流即可入池。
              - generic [ref=f3e593]:
                - heading "Q4：因子方向怎么定义？" [level=4] [ref=f3e594]
                - paragraph [ref=f3e595]: 平台对因子统一做去极值（1%~99% Winsor 缩尾）与 Z-score 标准化，因子方向取因子工作流中配置的方向，反向因子需手动在工作流设为负向。
              - generic [ref=f3e596]:
                - heading "Q5：收益率怎么计算？" [level=4] [ref=f3e597]

                - listitem [ref=f3e58]: 截面去极值：1%~99% Winsor 缩尾处理；截面标准化：Z-score。
                - listitem [ref=f3e59]: 池内全部合规因子等权合成，有效因子 M < 5 无法生成有效组合，池子不计分。
                - listitem [ref=f3e60]: 选股池剔除 ST、当日一字板、当日停牌；调仓周期由创建因子池时统一配置（1–10 个交易日，因子池提交后不可修改），池内全部因子与合成组合按该周期同步刷新信号、滚动调仓。
                - listitem [ref=f3e61]: 综合因子排序取前 10% 等权配置；单边成本 0.3%；基准 = 中证全指指数。
